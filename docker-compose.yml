version: "3.8"
services:
  wealthfarming:
    build:
      context: . 
    container_name: wealthfarming
    ports:
      - "3000:3000" 
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.wealthfarming.entrypoints=http'
      - 'traefik.http.routers.wealthfarming.rule=Host(`wealthfarming.org`)'
      - 'traefik.http.routers.wealthfarming-secure.entrypoints=https'
      - 'traefik.http.routers.wealthfarming-secure.rule=Host(`wealthfarming.org`)'
      - 'traefik.http.routers.wealthfarming-secure.tls.certresolver=letsencrypt'
    networks:
      - traefik  
networks:
  traefik:
    external: true 