name: CICD

on:
  push:
    branches:
      - development
    paths-ignore:
      - '.vscode/**'
      - '.env*'
      - 'docs/**'
      - '**.md'

env:
  SERVICE: dev-wealthfarming

jobs:
  build-image:
    if: contains(github.event.head_commit.message, '[cd-skip]') == false
    runs-on: dev-wealthfarming
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build . --file Dockerfile --tag dev-wealthfarming:latest

  deploy:
    needs: build-image
    runs-on: dev-wealthfarming
    container:
      image: dev-wealthfarming
      volumes:
        - '/root/wealthfarming/development/.env:/.env'
    steps:
      - name: Deploy Service
        run: |
          docker compose -f /root/wealthfarming/apps/docker-compose.yml up -d --force-recreate dev-wealthfarming
          docker image prune -f
